<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash Royale Sandbox - Edição Definitiva</title>
    <!-- Vinculando o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="arena">
        <div class="linha-divisoria"></div>
    </div>

    <div id="ui">
        <div id="status">
            <span>Elixir: <span id="texto-elixir">5</span>/10</span>
            <span style="color: #e74c3c;">Inimigos Derrotados: <span id="placar">0</span></span>
        </div>
        <div id="barra-elixir-container">
            <div id="barra-elixir"></div>
        </div>
        <div id="carrossel-deck">
            <div id="deck"></div>
        </div>
    </div>

    <!-- Vinculando o arquivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
